name: 'Tests/Site'

on:
  push:
    branches: [develop, main]
    paths:
      - 'acerola/**'
      - 'scripts/design/**'
      - 'scripts/i18n/**'
      - 'acerola.config.json'
      - '.github/workflows/site-tests.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'acerola/**'
      - 'scripts/design/**'
      - 'scripts/i18n/**'
      - 'acerola.config.json'
      - '.github/workflows/site-tests.yml'
  workflow_dispatch:

concurrency:
  group: site-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tipos, design, i18n, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola
    steps:
      # acerola-labs only allows GitHub's own actions, pinned by SHA; Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: acerola/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: node ../scripts/design/check-design.mjs
      - run: node ../scripts/i18n/check-i18n.mjs
      - run: npm test
      - run: npm run build
